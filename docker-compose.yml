version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart_lab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_lab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_lab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
